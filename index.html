<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Учет работы и доходов</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const THEMES = {
      ocean: { id: 'ocean', name: 'Морская', bg: 'bg-gradient-to-br from-slate-900 via-blue-950 to-cyan-950 text-slate-100', card: 'bg-slate-900/80 border-cyan-800/40 shadow-lg shadow-cyan-950/20 backdrop-blur-md', headerBg: 'bg-slate-900/90 border-cyan-800/50', navActive: 'bg-cyan-600 text-white shadow-md shadow-cyan-500/30', navInactive: 'text-slate-300 hover:bg-slate-800/80 hover:text-cyan-300', primary: 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-sm shadow-cyan-900/50', primaryBorder: 'border-cyan-500', accentText: 'text-cyan-400', mutedText: 'text-slate-400', input: 'bg-slate-800/90 border-slate-700 text-slate-100 focus:border-cyan-500 focus:ring-cyan-500/20', badgeWork: 'bg-cyan-950 text-cyan-300 border-cyan-700/60', badgeOff: 'bg-slate-800 text-slate-300 border-slate-700', badgeVacation: 'bg-amber-950 text-amber-300 border-amber-700/60', modalBg: 'bg-slate-900 border border-cyan-800/60 shadow-2xl shadow-cyan-950/50 text-slate-100' },
      sand: { id: 'sand', name: 'Песочная', bg: 'bg-gradient-to-br from-amber-50 via-orange-50 to-stone-100 text-stone-800', card: 'bg-white/90 border-stone-200 shadow-md shadow-stone-300/30 backdrop-blur-sm', headerBg: 'bg-white/95 border-b border-amber-200/80', navActive: 'bg-amber-700 text-white shadow-md shadow-amber-700/20', navInactive: 'text-stone-600 hover:bg-amber-100/60 hover:text-amber-900', primary: 'bg-amber-700 hover:bg-amber-600 text-white shadow-sm shadow-amber-900/20', primaryBorder: 'border-amber-600', accentText: 'text-amber-800 font-semibold', mutedText: 'text-stone-500', input: 'bg-stone-50 border-stone-300 text-stone-900 focus:border-amber-600 focus:ring-amber-600/20', badgeWork: 'bg-amber-100 text-amber-900 border-amber-300', badgeOff: 'bg-stone-200 text-stone-700 border-stone-300', badgeVacation: 'bg-orange-100 text-orange-900 border-orange-300', modalBg: 'bg-white border border-stone-200 shadow-2xl text-stone-800' },
      forest: { id: 'forest', name: 'Лесная', bg: 'bg-gradient-to-br from-stone-900 via-emerald-950 to-stone-900 text-emerald-50', card: 'bg-stone-900/80 border-emerald-800/40 shadow-lg shadow-emerald-950/30 backdrop-blur-md', headerBg: 'bg-stone-950/90 border-b border-emerald-800/50', navActive: 'bg-emerald-700 text-white shadow-md shadow-emerald-900/40', navInactive: 'text-emerald-200/80 hover:bg-emerald-900/50 hover:text-emerald-100', primary: 'bg-emerald-700 hover:bg-emerald-600 text-white shadow-sm shadow-emerald-950/50', primaryBorder: 'border-emerald-500', accentText: 'text-emerald-400', mutedText: 'text-emerald-300/60', input: 'bg-stone-800 border-emerald-900/80 text-emerald-100 focus:border-emerald-500 focus:ring-emerald-500/20', badgeWork: 'bg-emerald-950 text-emerald-300 border-emerald-700/60', badgeOff: 'bg-stone-800 text-stone-300 border-stone-700', badgeVacation: 'bg-lime-950 text-lime-300 border-lime-700/60', modalBg: 'bg-stone-900 border border-emerald-800/70 shadow-2xl shadow-emerald-950/60 text-emerald-50' },
      lavender: { id: 'lavender', name: 'Лаванда', bg: 'bg-gradient-to-br from-slate-900 via-purple-950 to-slate-950 text-purple-50', card: 'bg-slate-900/80 border-purple-800/40 shadow-lg shadow-purple-950/30 backdrop-blur-md', headerBg: 'bg-slate-950/90 border-b border-purple-800/50', navActive: 'bg-purple-600 text-white shadow-md shadow-purple-900/40', navInactive: 'text-purple-200/80 hover:bg-purple-900/40 hover:text-purple-100', primary: 'bg-purple-600 hover:bg-purple-500 text-white shadow-sm shadow-purple-900/50', primaryBorder: 'border-purple-500', accentText: 'text-purple-300', mutedText: 'text-purple-300/60', input: 'bg-slate-800/90 border-purple-900/60 text-purple-100 focus:border-purple-400 focus:ring-purple-400/20', badgeWork: 'bg-purple-950 text-purple-200 border-purple-700/60', badgeOff: 'bg-slate-800 text-slate-300 border-slate-700', badgeVacation: 'bg-fuchsia-950 text-fuchsia-200 border-fuchsia-700/60', modalBg: 'bg-slate-900 border border-purple-800/70 shadow-2xl shadow-purple-950/70 text-purple-50' },
      glassmorphism: { id: 'glassmorphism', name: 'Прозрачная', bg: 'bg-gradient-to-br from-gray-950 via-slate-900 to-zinc-950 text-slate-100', card: 'bg-white/10 border border-white/20 shadow-2xl backdrop-blur-xl backdrop-saturate-150', headerBg: 'bg-white/10 border-b border-white/15 backdrop-blur-xl', navActive: 'bg-white/25 text-white shadow-lg border border-white/30 backdrop-blur-xl', navInactive: 'text-slate-300 hover:bg-white/10 hover:text-white', primary: 'bg-white/20 hover:bg-white/30 text-white border border-white/30 backdrop-blur-md shadow-lg', primaryBorder: 'border-white/40', accentText: 'text-cyan-300 font-medium', mutedText: 'text-slate-300/70', input: 'bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:border-white/50 focus:ring-white/15 backdrop-blur-sm', badgeWork: 'bg-cyan-500/20 text-cyan-200 border border-cyan-400/40 backdrop-blur-sm', badgeOff: 'bg-white/10 text-slate-300 border border-white/20 backdrop-blur-sm', badgeVacation: 'bg-amber-500/20 text-amber-200 border border-amber-400/40 backdrop-blur-sm', modalBg: 'bg-slate-900/90 border border-white/20 shadow-2xl backdrop-blur-2xl text-slate-100' },
      emeraldVelvet: { id: 'emeraldVelvet', name: 'Темный зеленый бархат', bg: 'bg-gradient-to-br from-zinc-950 via-emerald-950 to-black text-emerald-100', card: 'bg-emerald-950/70 border border-amber-500/30 shadow-2xl shadow-black/60 backdrop-blur-md', headerBg: 'bg-zinc-950/90 border-b border-amber-500/40', navActive: 'bg-amber-600 text-zinc-950 font-semibold shadow-lg shadow-amber-600/20', navInactive: 'text-emerald-300/70 hover:bg-emerald-900/50 hover:text-amber-300', primary: 'bg-amber-600 hover:bg-amber-500 text-zinc-950 font-semibold shadow-md shadow-amber-600/30', primaryBorder: 'border-amber-500', accentText: 'text-amber-400', mutedText: 'text-emerald-400/60', input: 'bg-black/50 border border-emerald-800 text-emerald-100 focus:border-amber-500 focus:ring-amber-500/20', badgeWork: 'bg-emerald-900/80 text-amber-300 border border-amber-500/40', badgeOff: 'bg-zinc-900 text-zinc-400 border border-zinc-800', badgeVacation: 'bg-amber-950/80 text-amber-200 border border-amber-600/40', modalBg: 'bg-zinc-950 border border-amber-500/50 shadow-2xl text-emerald-100' },
      blueSatin: { id: 'blueSatin', name: 'Синий атлас', bg: 'bg-gradient-to-br from-slate-950 via-blue-900 to-indigo-950 text-blue-50', card: 'bg-blue-950/60 border border-blue-400/30 shadow-2xl shadow-blue-950/50 backdrop-blur-md', headerBg: 'bg-slate-950/90 border-b border-blue-500/40', navActive: 'bg-blue-600 text-white font-medium shadow-lg shadow-blue-500/40', navInactive: 'text-blue-200/70 hover:bg-blue-900/50 hover:text-white', primary: 'bg-blue-600 hover:bg-blue-500 text-white shadow-md shadow-blue-900/50', primaryBorder: 'border-blue-400', accentText: 'text-blue-300', mutedText: 'text-blue-300/60', input: 'bg-slate-900/80 border border-blue-800/80 text-blue-100 focus:border-blue-400 focus:ring-blue-400/20', badgeWork: 'bg-blue-900/80 text-blue-200 border border-blue-600/50', badgeOff: 'bg-slate-900 text-slate-300 border border-slate-800', badgeVacation: 'bg-indigo-950 text-indigo-200 border border-indigo-600/50', modalBg: 'bg-slate-950 border border-blue-500/50 shadow-2xl text-blue-500' }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState('schedule');
      const [themeKey, setThemeKey] = useState(() => localStorage.getItem('app_theme') || 'ocean');
      const [fontSize, setFontSize] = useState(() => localStorage.getItem('app_fontsize') || 'normal');
      
      const theme = THEMES[themeKey] || THEMES.ocean;

      const fontClass = {
        small: 'text-xs',
        normal: 'text-sm',
        large: 'text-base',
        xlarge: 'text-lg'
      }[fontSize] || 'text-sm';

      // Данные
      const [workplaces, setWorkplaces] = useState(() => JSON.parse(localStorage.getItem('app_workplaces') || '[]'));
      const [responsiblePersons, setResponsiblePersons] = useState(() => JSON.parse(localStorage.getItem('app_responsible') || '[]'));
      const [schedule, setSchedule] = useState(() => JSON.parse(localStorage.getItem('app_schedule') || '{}'));
      const [finances, setFinances] = useState(() => JSON.parse(localStorage.getItem('app_finances') || '[]'));

      useEffect(() => { localStorage.setItem('app_theme', themeKey); }, [themeKey]);
      useEffect(() => { localStorage.setItem('app_fontsize', fontSize); }, [fontSize]);
      useEffect(() => { localStorage.setItem('app_workplaces', JSON.stringify(workplaces)); }, [workplaces]);
      useEffect(() => { localStorage.setItem('app_responsible', JSON.stringify(responsiblePersons)); }, [responsiblePersons]);
      useEffect(() => { localStorage.setItem('app_schedule', JSON.stringify(schedule)); }, [schedule]);
      useEffect(() => { localStorage.setItem('app_finances', JSON.stringify(finances)); }, [finances]);

      // Модальные окна
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalType, setModalType] = useState(''); // 'workplace', 'responsible', 'finance'
      const [editItem, setEditItem] = useState(null);

      // Состояния форм
      const [wpForm, setWpForm] = useState({ name: '', siteName: '', responsibleId: '' });
      const [respForm, setRespForm] = useState({ name: '', phone: '', note: '' });
      const [finForm, setFinForm] = useState({ type: 'income', date: new Date().toISOString().split('T')[0], amount: '', currency: 'EUR', siteName: '', responsibleId: '', daysNote: '', note: '' });

      // Календарь состояние
      const [currentDate, setCurrentDate] = useState(new Date());
      const [dayModalDate, setDayModalDate] = useState(null);
      const [dayForm, setDayForm] = useState({ status: 'work', siteName: '', note: '' });

      const handleSaveWorkplace = (e) => {
        e.preventDefault();
        if(!wpForm.name.trim()) return;
        if(editItem) {
          setWorkplaces(workplaces.map(w => w.id === editItem.id ? { ...w, ...wpForm } : w));
        } else {
          setWorkplaces([...workplaces, { id: Date.now(), ...wpForm }]);
        }
        setIsModalOpen(false);
        setEditItem(null);
      };

      const handleSaveResponsible = (e) => {
        e.preventDefault();
        if(!respForm.name.trim()) return;
        if(editItem) {
          setResponsiblePersons(responsiblePersons.map(r => r.id === editItem.id ? { ...r, ...respForm } : r));
        } else {
          setResponsiblePersons([...responsiblePersons, { id: Date.now(), ...respForm }]);
        }
        setIsModalOpen(false);
        setEditItem(null);
      };

      const handleSaveFinance = (e) => {
        e.preventDefault();
        if(!finForm.amount) return;
        if(editItem) {
          setFinances(finances.map(f => f.id === editItem.id ? { ...f, ...finForm } : f));
        } else {
          setFinances([...finances, { id: Date.now(), ...finForm }]);
        }
        setIsModalOpen(false);
        setEditItem(null);
      };

      const handleSaveDay = (e) => {
        e.preventDefault();
        if(!dayModalDate) return;
        const key = `${dayModalDate.getFullYear()}-${String(dayModalDate.getMonth()+1).padStart(2,'0')}-${String(dayModalDate.getDate()).padStart(2,'0')}`;
        if(dayForm.status === 'none') {
          const newSch = {...schedule};
          delete newSch[key];
          setSchedule(newSch);
        } else {
          setSchedule({...schedule, [key]: { ...dayForm }});
        }
        setDayModalDate(null);
      };

      return (
        <div className={`min-h-screen ${theme.bg} ${fontClass} pb-24 transition-colors duration-300`}>
          {/* Шапка */}
          <header className={`sticky top-0 z-40 backdrop-blur-md ${theme.headerBg} px-4 py-3 flex items-center justify-between border-b`}>
            <div className="flex items-center space-x-2">
              <span className="text-xl">📅</span>
              <h1 className="font-bold text-lg tracking-wide">Учет работы</h1>
            </div>
            <nav className="flex space-x-1">
              {[
                { id: 'schedule', label: 'График' },
                { id: 'objects', label: 'Объекты' },
                { id: 'finances', label: 'Доходы' },
                { id: 'analytics', label: 'Аналитика' },
                { id: 'settings', label: 'Настройки' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setCurrentTab(tab.id)}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all ${currentTab === tab.id ? theme.navActive : theme.navInactive}`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>
          </header>

          {/* Основное содержимое */}
          <main className="max-w-6xl mx-auto p-4">
            {currentTab === 'schedule' && (
              <ScheduleView 
                schedule={schedule} 
                workplaces={workplaces} 
                theme={theme} 
                currentDate={currentDate} 
                setCurrentDate={setCurrentDate}
                onSelectDay={(date) => {
                  const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
                  setDayForm(schedule[key] || { status: 'work', siteName: workplaces[0]?.siteName || '', note: '' });
                  setDayModalDate(date);
                }}
              />
            )}

            {currentTab === 'objects' && (
              <ObjectsView 
                workplaces={workplaces} 
                responsiblePersons={responsiblePersons} 
                theme={theme}
                onAddWp={() => { setWpForm({ name: '', siteName: '', responsibleId: '' }); setEditItem(null); setModalType('workplace'); setIsModalOpen(true); }}
                onEditWp={(w) => { setWpForm(w); setEditItem(w); setModalType('workplace'); setIsModalOpen(true); }}
                onDeleteWp={(id) => setWorkplaces(workplaces.filter(w => w.id !== id))}
                onAddResp={() => { setRespForm({ name: '', phone: '', note: '' }); setEditItem(null); setModalType('responsible'); setIsModalOpen(true); }}
                onEditResp={(r) => { setRespForm(r); setEditItem(r); setModalType('responsible'); setIsModalOpen(true); }}
                onDeleteResp={(id) => setResponsiblePersons(responsiblePersons.filter(r => r.id !== id))}
              />
            )}

            {currentTab === 'finances' && (
              <FinancesView 
                finances={finances} 
                workplaces={workplaces} 
                responsiblePersons={responsiblePersons}
                theme={theme}
                onAddFin={() => { setFinForm({ type: 'income', date: new Date().toISOString().split('T')[0], amount: '', currency: 'EUR', siteName: '', responsibleId: '', daysNote: '', note: '' }); setEditItem(null); setModalType('finance'); setIsModalOpen(true); }}
                onEditFin={(f) => { setFinForm(f); setEditItem(f); setModalType('finance'); setIsModalOpen(true); }}
                onDeleteFin={(id) => setFinances(finances.filter(f => f.id !== id))}
              />
            )}

            {currentTab === 'analytics' && (
              <AnalyticsView schedule={schedule} finances={finances} workplaces={workplaces} responsiblePersons={responsiblePersons} theme={theme} />
            )}

            {currentTab === 'settings' && (
              <SettingsView 
                themeKey={themeKey} 
                setThemeKey={setThemeKey} 
                fontSize={fontSize} 
                setFontSize={setFontSize} 
                theme={theme}
                exportData={() => {
                  const data = { workplaces, responsiblePersons, schedule, finances };
                  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a'); a.href = url; a.download = 'work-tracker-backup.json'; a.click();
                }}
                importData={(e) => {
                  const file = e.target.files[0];
                  if(!file) return;
                  const reader = new FileReader();
                  reader.onload = (evt) => {
                    try {
                      const data = JSON.parse(evt.target.result);
                      if(data.workplaces) setWorkplaces(data.workplaces);
                      if(data.responsiblePersons) setResponsiblePersons(data.responsiblePersons);
                      if(data.schedule) setSchedule(data.schedule);
                      if(data.finances) setFinances(data.finances);
                      alert('Данные успешно импортированы!');
                    } catch(err) { alert('Ошибка чтения файла'); }
                  };
                  reader.readAsText(file);
                }}
              />
            )}
          </main>

          {/* Модальное окно день */}
          {dayModalDate && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className={`${theme.modalBg} rounded-2xl p-6 w-full max-w-md shadow-2xl`}>
                <h3 className="text-lg font-bold mb-4">
                  День: {dayModalDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}
                </h3>
                <form onSubmit={handleSaveDay} className="space-y-4">
                  <div>
                    <label className="block mb-1 font-medium">Статус дня</label>
                    <select className={`w-full p-2.5 rounded-xl border ${theme.input}`} value={dayForm.status} onChange={e => setDayForm({...dayForm, status: e.target.value})}>
                      <option value="work">Рабочий день</option>
                      <option value="vacation">Отпуск</option>
                      <option value="off">Отгул</option>
                      <option value="weekend">Выходной</option>
                      <option value="none">Очистить день</option>
                    </select>
                  </div>
                  {dayForm.status === 'work' && (
                    <div>
                      <label className="block mb-1 font-medium">Объект / Работа</label>
                      <select className={`w-full p-2.5 rounded-xl border ${theme.input}`} value={dayForm.siteName} onChange={e => setDayForm({...dayForm, siteName: e.target.value})}>
                        <option value="">-- Выберите объект --</option>
                        {workplaces.map(w => <option key={w.id} value={w.siteName}>{w.name} — {w.siteName}</option>)}
                      </select>
                    </div>
                  )}
                  <div>
                    <label className="block mb-1 font-medium">Заметка</label>
                    <input type="text" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="Детали дня..." value={dayForm.note} onChange={e => setDayForm({...dayForm, note: e.target.value})} />
                  </div>
                  <div className="flex justify-end space-x-3 pt-2">
                    <button type="button" onClick={() => setDayModalDate(null)} className="px-4 py-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white">Отмена</button>
                    <button type="submit" className={`px-5 py-2 rounded-xl ${theme.primary}`}>Сохранить</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Общие модальные окна */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className={`${theme.modalBg} rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto`}>
                
                {modalType === 'workplace' && (
                  <>
                    <h3 className="text-lg font-bold mb-4">{editItem ? 'Редактировать объект' : 'Новое место работы'}</h3>
                    <form onSubmit={handleSaveWorkplace} className="space-y-4">
                      <div>
                        <label className="block mb-1 font-medium">Место работы (Компания / Организация)</label>
                        <input required type="text" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="Например: ООО СтройСервис" value={wpForm.name} onChange={e => setWpForm({...wpForm, name: e.target.value})} />
                      </div>
                      <div>
                        <label className="block mb-1 font-medium">Наименование объекта / работы</label>
                        <input required type="text" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="Например: ЖК Солнечный, кв 45" value={wpForm.siteName} onChange={e => setWpForm({...wpForm, siteName: e.target.value})} />
                      </div>
                      <div>
                        <label className="block mb-1 font-medium">Ответственное лицо (Плательщик)</label>
                        <select className={`w-full p-2.5 rounded-xl border ${theme.input}`} value={wpForm.responsibleId} onChange={e => setWpForm({...wpForm, responsibleId: e.target.value})}>
                          <option value="">-- Без ответственного --</option>
                          {responsiblePersons.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                        </select>
                      </div>
                      <div className="flex justify-end space-x-3 pt-2">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white">Отмена</button>
                        <button type="submit" className={`px-5 py-2 rounded-xl ${theme.primary}`}>Сохранить</button>
                      </div>
                    </form>
                  </>
                )}

                {modalType === 'responsible' && (
                  <>
                    <h3 className="text-lg font-bold mb-4">{editItem ? 'Редактировать ответственного' : 'Новое ответственное лицо'}</h3>
                    <form onSubmit={handleSaveResponsible} className="space-y-4">
                      <div>
                        <label className="block mb-1 font-medium">Имя / ФИО</label>
                        <input required type="text" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="Иван Петров" value={respForm.name} onChange={e => setRespForm({...respForm, name: e.target.value})} />
                      </div>
                      <div>
                        <label className="block mb-1 font-medium">Телефон / Контакт</label>
                        <input type="text" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="+359..." value={respForm.phone} onChange={e => setRespForm({...respForm, phone: e.target.value})} />
                      </div>
                      <div>
                        <label className="block mb-1 font-medium">Заметка</label>
                        <input type="text" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="Примечания..." value={respForm.note} onChange={e => setRespForm({...respForm, note: e.target.value})} />
                      </div>
                      <div className="flex justify-end space-x-3 pt-2">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white">Отмена</button>
                        <button type="submit" className={`px-5 py-2 rounded-xl ${theme.primary}`}>Сохранить</button>
                      </div>
                    </form>
                  </>
                )}

                {modalType === 'finance' && (
                  <>
                    <h3 className="text-lg font-bold mb-4">{editItem ? 'Редактировать запись' : 'Добавить доход / аванс'}</h3>
                    <form onSubmit={handleSaveFinance} className="space-y-4">
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block mb-1 font-medium">Тип</label>
                          <select className={`w-full p-2.5 rounded-xl border ${theme.input}`} value={finForm.type} onChange={e => setFinForm({...finForm, type: e.target.value})}>
                            <option value="income">Доход</option>
                            <option value="advance">Аванс</option>
                          </select>
                        </div>
                        <div>
                          <label className="block mb-1 font-medium">Дата</label>
                          <input required type="date" className={`w-full p-2.5 rounded-xl border ${theme.input}`} value={finForm.date} onChange={e => setFinForm({...finForm, date: e.target.value})} />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block mb-1 font-medium">Сумма</label>
                          <input required type="number" step="0.01" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="0.00" value={finForm.amount} onChange={e => setFinForm({...finForm, amount: e.target.value})} />
                        </div>
                        <div>
                          <label className="block mb-1 font-medium">Валюта</label>
                          <select className={`w-full p-2.5 rounded-xl border ${theme.input}`} value={finForm.currency} onChange={e => setFinForm({...finForm, currency: e.target.value})}>
                            <option value="EUR">EUR (€)</option>
                            <option value="BGN">BGN (лв)</option>
                            <option value="USD">USD ($)</option>
                            <option value="RUB">RUB (₽)</option>
                            <option value="UAH">UAH (₴)</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="block mb-1 font-medium">Объект / Работа</label>
                        <select className={`w-full p-2.5 rounded-xl border ${theme.input}`} value={finForm.siteName} onChange={e => setFinForm({...finForm, siteName: e.target.value})}>
                          <option value="">-- Выберите объект --</option>
                          {workplaces.map(w => <option key={w.id} value={w.siteName}>{w.name} — {w.siteName}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block mb-1 font-medium">Ответственное лицо</label>
                        <select className={`w-full p-2.5 rounded-xl border ${theme.input}`} value={finForm.responsibleId} onChange={e => setFinForm({...finForm, responsibleId: e.target.value})}>
                          <option value="">-- Выберите ответственного --</option>
                          {responsiblePersons.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block mb-1 font-medium">За какие дни / период</label>
                        <input type="text" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="Например: 1-15 октября" value={finForm.daysNote} onChange={e => setFinForm({...finForm, daysNote: e.target.value})} />
                      </div>
                      <div>
                        <label className="block mb-1 font-medium">Примечания</label>
                        <input type="text" className={`w-full p-2.5 rounded-xl border ${theme.input}`} placeholder="Детали..." value={finForm.note} onChange={e => setFinForm({...finForm, note: e.target.value})} />
                      </div>
                      <div className="flex justify-end space-x-3 pt-2">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white">Отмена</button>
                        <button type="submit" className={`px-5 py-2 rounded-xl ${theme.primary}`}>Сохранить</button>
                      </div>
                    </form>
                  </>
                )}

              </div>
            </div>
          )}
        </div>
      );
    }

    // Компонент: График
    function ScheduleView({ schedule, workplaces, theme, currentDate, setCurrentDate, onSelectDay }) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Пн старт

      const calendarCells = [];
      for(let i = 0; i < firstDayIndex; i++) calendarCells.push(null);
      for(let d = 1; d <= daysInMonth; d++) calendarCells.push(new Date(year, month, d));

      return (
        <div className={`p-5 rounded-2xl border ${theme.card} shadow-xl`}>
          <div className="flex items-center justify-between mb-6">
            <h2 className="text-xl font-bold">{monthNames[month]} {year}</h2>
            <div className="flex space-x-2">
              <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="px-3 py-1.5 rounded-xl bg-slate-700/30 hover:bg-slate-700/60 font-bold">‹</button>
              <button onClick={() => setCurrentDate(new Date())} className="px-3 py-1.5 rounded-xl bg-slate-700/30 hover:bg-slate-700/60 text-xs font-semibold">Сегодня</button>
              <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="px-3 py-1.5 rounded-xl bg-slate-700/30 hover:bg-slate-700/60 font-bold">›</button>
            </div>
          </div>

          <div className="grid grid-cols-7 gap-2 mb-2 text-center font-semibold text-xs opacity-70">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
          </div>

          <div className="grid grid-cols-7 gap-2">
            {calendarCells.map((date, idx) => {
              if(!date) return <div key={idx} className="h-24"></div>;
              const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
              const dayData = schedule[key];

              let badgeStyle = "border bg-transparent";
              let label = "";
              if(dayData) {
                if(dayData.status === 'work') { badgeStyle = theme.badgeWork; label = dayData.siteName || 'Работа'; }
                if(dayData.status === 'vacation') { badgeStyle = theme.badgeVacation; label = 'Отпуск'; }
                if(dayData.status === 'off') { badgeStyle = theme.badgeOff; label = 'Отгул'; }
                if(dayData.status === 'weekend') { badgeStyle = theme.badgeOff; label = 'Выходной'; }
              }

              return (
                <div 
                  key={idx} 
                  onClick={() => onSelectDay(date)}
                  className={`h-24 p-2 rounded-xl border border-white/10 flex flex-col justify-between cursor-pointer transition-all hover:scale-[1.02] ${badgeStyle}`}
                >
                  <div className="flex justify-between items-center text-xs font-bold">
                    <span>{date.getDate()}</span>
                    {dayData && <span className="w-2 h-2 rounded-full bg-current"></span>}
                  </div>
                  <div className="overflow-hidden">
                    {dayData && (
                      <div className="text-[10px] leading-tight font-medium truncate mt-1">
                        {label}
                        {dayData.note && <div className="opacity-70 truncate">{dayData.note}</div>}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Компонент: Объекты и Ответственные
    function ObjectsView({ workplaces, responsiblePersons, theme, onAddWp, onEditWp, onDeleteWp, onAddResp, onEditResp, onDeleteResp }) {
      return (
        <div className="space-y-8">
          {/* Секция: Ответственные лица */}
          <div className={`p-5 rounded-2xl border ${theme.card}`}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-lg font-bold">Ответственные лица (Плательщики)</h2>
              <button onClick={onAddResp} className={`px-4 py-2 rounded-xl text-xs font-semibold ${theme.primary}`}>+ Добавить лицо</button>
            </div>
            {responsiblePersons.length === 0 ? (
              <p className="text-sm opacity-60">Нет добавленных ответственных лиц.</p>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {responsiblePersons.map(r => (
                  <div key={r.id} className="p-3.5 rounded-xl border border-white/10 flex justify-between items-center bg-black/10">
                    <div>
                      <div className="font-bold">{r.name}</div>
                      {r.phone && <div className="text-xs opacity-70">Тел: {r.phone}</div>}
                      {r.note && <div className="text-xs opacity-60">{r.note}</div>}
                    </div>
                    <div className="flex space-x-2">
                      <button onClick={() => onEditResp(r)} className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs">✏️</button>
                      <button onClick={() => onDeleteResp(r.id)} className="p-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-xs text-red-300">🗑️</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Секция: Объекты / Места работы */}
          <div className={`p-5 rounded-2xl border ${theme.card}`}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-lg font-bold">Места работы и объекты</h2>
              <button onClick={onAddWp} className={`px-4 py-2 rounded-xl text-xs font-semibold ${theme.primary}`}>+ Добавить объект</button>
            </div>
            {workplaces.length === 0 ? (
              <p className="text-sm opacity-60">Нет добавленных объектов.</p>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {workplaces.map(w => {
                  const resp = responsiblePersons.find(r => r.id == w.responsibleId);
                  return (
                    <div key={w.id} className="p-4 rounded-xl border border-white/10 flex justify-between items-center bg-black/10">
                      <div>
                        <div className="font-bold text-base">{w.siteName}</div>
                        <div className="text-xs opacity-80 mt-0.5">Организация: {w.name}</div>
                        {resp && <div className={`text-xs mt-1 font-medium ${theme.accentText}`}>Ответственный: {resp.name}</div>}
                      </div>
                      <div className="flex space-x-2">
                        <button onClick={() => onEditWp(w)} className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs">✏️</button>
                        <button onClick={() => onDeleteWp(w.id)} className="p-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-xs text-red-300">🗑️</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Компонент: Доходы и авансы
    function FinancesView({ finances, workplaces, responsiblePersons, theme, onAddFin, onEditFin, onDeleteFin }) {
      return (
        <div className={`p-5 rounded-2xl border ${theme.card}`}>
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-xl font-bold">Учет доходов и авансов</h2>
            <button onClick={onAddFin} className={`px-4 py-2 rounded-xl text-xs font-semibold ${theme.primary}`}>+ Добавить запись</button>
          </div>

          {finances.length === 0 ? (
            <p className="text-sm opacity-60">Нет финансовых записей.</p>
          ) : (
            <div className="space-y-3">
              {finances.sort((a,b) => new Date(b.date) - new Date(a.date)).map(f => {
                const resp = responsiblePersons.find(r => r.id == f.responsibleId);
                const isIncome = f.type === 'income';
                return (
                  <div key={f.id} className="p-4 rounded-xl border border-white/10 flex flex-col md:flex-row justify-between items-start md:items-center bg-black/10 gap-3">
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${isIncome ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}`}>
                          {isIncome ? 'ДОХОД' : 'АВАНС'}
                        </span>
                        <span className="font-bold text-base">{f.amount} {f.currency}</span>
                        <span className="text-xs opacity-65">({f.date})</span>
                      </div>
                      <div className="text-xs mt-1.5 opacity-90">
                        {f.siteName && <span className="mr-3">🏗️ <b>{f.siteName}</b></span>}
                        {resp && <span>👤 {resp.name}</span>}
                      </div>
                      {f.daysNote && <div className="text-xs opacity-70 mt-1">За дни: {f.daysNote}</div>}
                      {f.note && <div className="text-xs opacity-60 mt-0.5">Примечание: {f.note}</div>}
                    </div>
                    <div className="flex space-x-2 self-end md:self-center">
                      <button onClick={() => onEditFin(f)} className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs">✏️</button>
                      <button onClick={() => onDeleteFin(f.id)} className="p-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-xs text-red-300">🗑️</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // Компонент: Аналитика
    function AnalyticsView({ schedule, finances, workplaces, responsiblePersons, theme }) {
      const [filterPeriod, setFilterPeriod] = useState('month'); // month, year, all
      const [filterSite, setFilterSite] = useState('');
      const [filterResp, setFilterResp] = useState('');

      // Подсчет дней по объектам
      const siteDaysCount = useMemo(() => {
        const counts = {};
        Object.values(schedule).forEach(day => {
          if(day.status === 'work' && day.siteName) {
            counts[day.siteName] = (counts[day.siteName] || 0) + 1;
          }
        });
        return counts;
      }, [schedule]);

      // Фильтрация финансов
      const filteredFinances = useMemo(() => {
        return finances.filter(f => {
          if(filterSite && f.siteName !== filterSite) return false;
          if(filterResp && f.responsibleId != filterResp) return false;
          
          const fDate = new Date(f.date);
          const now = new Date();
          if(filterPeriod === 'month') {
            if(fDate.getMonth() !== now.getMonth() || fDate.getFullYear() !== now.getFullYear()) return false;
          } else if(filterPeriod === 'year') {
            if(fDate.getFullYear() !== now.getFullYear()) return false;
          }
          return true;
        });
      }, [finances, filterPeriod, filterSite, filterResp]);

      // Суммы по валютам
      const totalsByCurrency = useMemo(() => {
        const totals = { income: {}, advance: {} };
        filteredFinances.forEach(f => {
          const cat = f.type === 'income' ? 'income' : 'advance';
          totals[cat][f.currency] = (totals[cat][f.currency] || 0) + parseFloat(f.amount || 0);
        });
        return totals;
      }, [filteredFinances]);

      return (
        <div className="space-y-6">
          {/* Фильтры */}
          <div className={`p-4 rounded-2xl border ${theme.card} flex flex-wrap gap-4 items-center justify-between`}>
            <div className="flex space-x-2">
              {['month', 'year', 'all'].map(p => (
                <button
                  key={p}
                  onClick={() => setFilterPeriod(p)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold ${filterPeriod === p ? theme.primary : 'bg-white/10 hover:bg-white/20'}`}
                >
                  {p === 'month' ? 'Месяц' : p === 'year' ? 'Год' : 'Всё время'}
                </button>
              ))}
            </div>
            <div className="flex space-x-3">
              <select className={`p-2 rounded-xl border text-xs ${theme.input}`} value={filterSite} onChange={e => setFilterSite(e.target.value)}>
                <option value="">Все объекты</option>
                {workplaces.map(w => <option key={w.id} value={w.siteName}>{w.siteName}</option>)}
              </select>
              <select className={`p-2 rounded-xl border text-xs ${theme.input}`} value={filterResp} onChange={e => setFilterResp(e.target.value)}>
                <option value="">Все ответственные</option>
                {responsiblePersons.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
            </div>
          </div>

          {/* Финансовые итоги */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className={`p-5 rounded-2xl border ${theme.card}`}>
              <h3 className="text-base font-bold mb-3">💰 Доходы</h3>
              {Object.keys(totalsByCurrency.income).length === 0 ? (
                <p className="text-xs opacity-60">Нет данных за период</p>
              ) : (
                <div className="space-y-1">
                  {Object.entries(totalsByCurrency.income).map(([curr, sum]) => (
                    <div key={curr} className="text-lg font-bold text-emerald-400">{sum.toFixed(2)} {curr}</div>
                  ))}
                </div>
              )}
            </div>

            <div className={`p-5 rounded-2xl border ${theme.card}`}>
              <h3 className="text-base font-bold mb-3">📥 Авансы</h3>
              {Object.keys(totalsByCurrency.advance).length === 0 ? (
                <p className="text-xs opacity-60">Нет данных за период</p>
              ) : (
                <div className="space-y-1">
                  {Object.entries(totalsByCurrency.advance).map(([curr, sum]) => (
                    <div key={curr} className="text-lg font-bold text-amber-400">{sum.toFixed(2)} {curr}</div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Статистика по дням на объектах */}
          <div className={`p-5 rounded-2xl border ${theme.card}`}>
            <h3 className="text-base font-bold mb-4">🏗️ Количество рабочих дней на объектах (за всё время)</h3>
            {Object.keys(siteDaysCount).length === 0 ? (
              <p className="text-xs opacity-60">Нет отмеченных рабочих дней в графике</p>
            ) : (
              <div className="space-y-3">
                {Object.entries(siteDaysCount).map(([site, count]) => (
                  <div key={site} className="flex justify-between items-center p-3 rounded-xl bg-black/10 border border-white/10">
                    <span className="font-semibold text-sm">{site}</span>
                    <span className={`px-3 py-1 rounded-lg text-xs font-bold ${theme.primary}`}>{count} дн.</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Компонент: Настройки
    function SettingsView({ themeKey, setThemeKey, fontSize, setFontSize, theme, exportData, importData }) {
      return (
        <div className={`p-6 rounded-2xl border ${theme.card} space-y-6 max-w-xl mx-auto`}>
          <h2 className="text-xl font-bold">Настройки приложения</h2>

          <div>
            <label className="block mb-2 font-medium text-sm">Выбор темы оформления</label>
            <select className={`w-full p-3 rounded-xl border ${theme.input}`} value={themeKey} onChange={e => setThemeKey(e.target.value)}>
              <option value="ocean">Морская</option>
              <option value="sand">Песочная</option>
              <option value="forest">Лесная</option>
              <option value="lavender">Лаванда</option>
              <option value="glassmorphism">Прозрачная</option>
              <option value="emeraldVelvet">Темный зеленый бархат</option>
              <option value="blueSatin">Синий атлас</option>
            </select>
          </div>

          <div>
            <label className="block mb-2 font-medium text-sm">Размер шрифта</label>
            <select className={`w-full p-3 rounded-xl border ${theme.input}`} value={fontSize} onChange={e => setFontSize(e.target.value)}>
              <option value="small">Мелкий</option>
              <option value="normal">Нормальный</option>
              <option value="large">Крупный</option>
              <option value="xlarge">Очень крупный</option>
            </select>
          </div>

          <div className="pt-4 border-t border-white/10 space-y-3">
            <h3 className="font-bold text-sm">Резервное копирование</h3>
            <div className="flex gap-3">
              <button onClick={exportData} className={`flex-1 py-2.5 rounded-xl text-xs font-semibold ${theme.primary}`}>Экспорт данных (JSON)</button>
              <label className={`flex-1 py-2.5 rounded-xl text-xs font-semibold text-center cursor-pointer bg-slate-700/50 hover:bg-slate-700 text-white`}>
                Импорт данных
                <input type="file" accept=".json" onChange={importData} className="hidden" />
              </label>
            </div>
          </div>

          <div className="pt-4 border-t border-white/10 text-xs opacity-60 space-y-1">
            <div>Версия приложения: v1.5.0</div>
            <div>Дата последнего обновления: 26 октября 2026</div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Учет работы и доходов</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    /* Кастомный скроллбар для мобильной навигации */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const THEMES = {
      ocean: { id: 'ocean', name: 'Морская', bg: 'bg-gradient-to-br from-slate-900 via-blue-950 to-cyan-950 text-slate-100', card: 'bg-slate-900/80 border-cyan-800/40 shadow-lg backdrop-blur-md', headerBg: 'bg-slate-900/95 border-cyan-800/50', navActive: 'bg-cyan-600 text-white shadow-md shadow-cyan-500/30', navInactive: 'text-slate-300 hover:bg-slate-800/80 hover:text-cyan-300', primary: 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-sm', primaryBorder: 'border-cyan-500', accentText: 'text-cyan-400', input: 'bg-slate-800/90 border-slate-700 text-slate-100 focus:border-cyan-500', badgeWork: 'bg-cyan-950 text-cyan-300 border-cyan-700/60', badgeUnpaid: 'bg-red-950/90 text-red-200 border-red-500/80 font-semibold animate-pulse', badgeOff: 'bg-slate-800 text-slate-300 border-slate-700', badgeVacation: 'bg-amber-950 text-amber-300 border-amber-700/60', modalBg: 'bg-slate-900 border border-cyan-800/60 text-slate-100' },
      sand: { id: 'sand', name: 'Песочная', bg: 'bg-gradient-to-br from-amber-50 via-orange-50 to-stone-100 text-stone-800', card: 'bg-white/90 border-stone-200 shadow-md backdrop-blur-sm', headerBg: 'bg-white/95 border-amber-200/80', navActive: 'bg-amber-700 text-white shadow-md', navInactive: 'text-stone-600 hover:bg-amber-100/60 hover:text-amber-900', primary: 'bg-amber-700 hover:bg-amber-600 text-white', primaryBorder: 'border-amber-600', accentText: 'text-amber-800 font-semibold', input: 'bg-stone-50 border-stone-300 text-stone-900 focus:border-amber-600', badgeWork: 'bg-amber-100 text-amber-900 border-amber-300', badgeUnpaid: 'bg-red-100 text-red-900 border-red-400 font-semibold', badgeOff: 'bg-stone-200 text-stone-700 border-stone-300', badgeVacation: 'bg-orange-100 text-orange-900 border-orange-300', modalBg: 'bg-white border border-stone-200 text-stone-800' },
      forest: { id: 'forest', name: 'Лесная', bg: 'bg-gradient-to-br from-stone-900 via-emerald-950 to-stone-900 text-emerald-50', card: 'bg-stone-900/80 border-emerald-800/40 shadow-lg backdrop-blur-md', headerBg: 'bg-stone-950/95 border-emerald-800/50', navActive: 'bg-emerald-700 text-white shadow-md', navInactive: 'text-emerald-200/80 hover:bg-emerald-900/50 hover:text-emerald-100', primary: 'bg-emerald-700 hover:bg-emerald-600 text-white', primaryBorder: 'border-emerald-500', accentText: 'text-emerald-400', input: 'bg-stone-800 border-emerald-900/80 text-emerald-100 focus:border-emerald-500', badgeWork: 'bg-emerald-950 text-emerald-300 border-emerald-700/60', badgeUnpaid: 'bg-rose-950 text-rose-200 border-rose-500 font-semibold', badgeOff: 'bg-stone-800 text-stone-300 border-stone-700', badgeVacation: 'bg-lime-950 text-lime-300 border-lime-700/60', modalBg: 'bg-stone-900 border border-emerald-800/70 text-emerald-50' },
      lavender: { id: 'lavender', name: 'Лаванда', bg: 'bg-gradient-to-br from-slate-900 via-purple-950 to-slate-950 text-purple-50', card: 'bg-slate-900/80 border-purple-800/40 shadow-lg backdrop-blur-md', headerBg: 'bg-slate-950/95 border-purple-800/50', navActive: 'bg-purple-600 text-white shadow-md', navInactive: 'text-purple-200/80 hover:bg-purple-900/40 hover:text-purple-100', primary: 'bg-purple-600 hover:bg-purple-500 text-white', primaryBorder: 'border-purple-500', accentText: 'text-purple-300', input: 'bg-slate-800/90 border-purple-900/60 text-purple-100 focus:border-purple-400', badgeWork: 'bg-purple-950 text-purple-200 border-purple-700/60', badgeUnpaid: 'bg-red-950 text-red-200 border-red-500 font-semibold', badgeOff: 'bg-slate-800 text-slate-300 border-slate-700', badgeVacation: 'bg-fuchsia-950 text-fuchsia-200 border-fuchsia-700/60', modalBg: 'bg-slate-900 border border-purple-800/70 text-purple-50' },
      glassmorphism: { id: 'glassmorphism', name: 'Прозрачная', bg: 'bg-gradient-to-br from-gray-950 via-slate-900 to-zinc-950 text-slate-100', card: 'bg-white/10 border border-white/20 shadow-2xl backdrop-blur-xl', headerBg: 'bg-white/10 border-b border-white/15 backdrop-blur-xl', navActive: 'bg-white/25 text-white shadow-lg border border-white/30', navInactive: 'text-slate-300 hover:bg-white/10 hover:text-white', primary: 'bg-white/20 hover:bg-white/30 text-white border border-white/30', primaryBorder: 'border-white/40', accentText: 'text-cyan-300 font-medium', input: 'bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:border-white/50', badgeWork: 'bg-cyan-500/20 text-cyan-200 border border-cyan-400/40', badgeUnpaid: 'bg-red-500/30 text-red-100 border border-red-400/80 font-bold', badgeOff: 'bg-white/10 text-slate-300 border border-white/20', badgeVacation: 'bg-amber-500/20 text-amber-200 border border-amber-400/40', modalBg: 'bg-slate-900/90 border border-white/20 backdrop-blur-2xl text-slate-100' },
      emeraldVelvet: { id: 'emeraldVelvet', name: 'Темный зеленый бархат', bg: 'bg-gradient-to-br from-zinc-950 via-emerald-950 to-black text-emerald-100', card: 'bg-emerald-950/70 border border-amber-500/30 shadow-2xl backdrop-blur-md', headerBg: 'bg-zinc-950/95 border-amber-500/40', navActive: 'bg-amber-600 text-zinc-950 font-semibold shadow-lg', navInactive: 'text-emerald-300/70 hover:bg-emerald-900/50 hover:text-amber-300', primary: 'bg-amber-600 hover:bg-amber-500 text-zinc-950 font-semibold', primaryBorder: 'border-amber-500', accentText: 'text-amber-400', input: 'bg-black/50 border border-emerald-800 text-emerald-100 focus:border-amber-500', badgeWork: 'bg-emerald-900/80 text-amber-300 border border-amber-500/40', badgeUnpaid: 'bg-red-950 text-red-200 border border-red-500 font-bold', badgeOff: 'bg-zinc-900 text-zinc-400 border border-zinc-800', badgeVacation: 'bg-amber-950/80 text-amber-200 border border-amber-600/40', modalBg: 'bg-zinc-950 border border-amber-500/50 text-emerald-100' },
      blueSatin: { id: 'blueSatin', name: 'Синий атлас', bg: 'bg-gradient-to-br from-slate-950 via-blue-900 to-indigo-950 text-blue-50', card: 'bg-blue-950/60 border border-blue-400/30 shadow-2xl backdrop-blur-md', headerBg: 'bg-slate-950/95 border-blue-500/40', navActive: 'bg-blue-600 text-white font-medium shadow-lg', navInactive: 'text-blue-200/70 hover:bg-blue-900/50 hover:text-white', primary: 'bg-blue-600 hover:bg-blue-500 text-white', primaryBorder: 'border-blue-400', accentText: 'text-blue-300', input: 'bg-slate-900/80 border border-blue-800/80 text-blue-100 focus:border-blue-400', badgeWork: 'bg-blue-900/80 text-blue-200 border border-blue-600/50', badgeUnpaid: 'bg-red-950 text-red-200 border border-red-500 font-bold', badgeOff: 'bg-slate-900 text-slate-300 border border-slate-800', badgeVacation: 'bg-indigo-950 text-indigo-200 border border-indigo-600/50', modalBg: 'bg-slate-950 border border-blue-500/50 text-blue-50' }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState('schedule');
      const [themeKey, setThemeKey] = useState(() => localStorage.getItem('app_theme') || 'ocean');
      const [fontSize, setFontSize] = useState(() => localStorage.getItem('app_fontsize') || 'normal');
      const [calendarViewMode, setCalendarViewMode] = useState('grid'); // 'grid' или 'list'
      
      const theme = THEMES[themeKey] || THEMES.ocean;

      const fontClass = {
        small: 'text-xs',
        normal: 'text-sm',
        large: 'text-base',
        xlarge: 'text-lg'
      }[fontSize] || 'text-sm';

      // Хранилище данных
      const [workplaces, setWorkplaces] = useState(() => JSON.parse(localStorage.getItem('app_workplaces') || '[]'));
      const [responsiblePersons, setResponsiblePersons] = useState(() => JSON.parse(localStorage.getItem('app_responsible') || '[]'));
      const [schedule, setSchedule] = useState(() => JSON.parse(localStorage.getItem('app_schedule') || '{}'));
      const [finances, setFinances] = useState(() => JSON.parse(localStorage.getItem('app_finances') || '[]'));

      useEffect(() => { localStorage.setItem('app_theme', themeKey); }, [themeKey]);
      useEffect(() => { localStorage.setItem('app_fontsize', fontSize); }, [fontSize]);
      useEffect(() => { localStorage.setItem('app_workplaces', JSON.stringify(workplaces)); }, [workplaces]);
      useEffect(() => { localStorage.setItem('app_responsible', JSON.stringify(responsiblePersons)); }, [responsiblePersons]);
      useEffect(() => { localStorage.setItem('app_schedule', JSON.stringify(schedule)); }, [schedule]);
      useEffect(() => { localStorage.setItem('app_finances', JSON.stringify(finances)); }, [finances]);

      // Модальные окна
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalType, setModalType] = useState('');
      const [editItem, setEditItem] = useState(null);

      // Формы
      const [wpForm, setWpForm] = useState({ name: '', siteName: '', responsibleId: '' });
      const [respForm, setRespForm] = useState({ name: '', phone: '', note: '' });
      const [finForm, setFinForm] = useState({ type: 'income', date: new Date().toISOString().split('T')[0], amount: '', currency: 'EUR', siteName: '', responsibleId: '', daysNote: '', note: '' });

      // Календарь состояние
      const [currentDate, setCurrentDate] = useState(new Date());
      const [dayModalDate, setDayModalDate] = useState(null);
      const [dayForm, setDayForm] = useState({ status: 'work', siteName: '', isPaid: true, note: '' });

      const handleSaveWorkplace = (e) => {
        e.preventDefault();
        if(!wpForm.name.trim()) return;
        if(editItem) {
          setWorkplaces(workplaces.map(w => w.id === editItem.id ? { ...w, ...wpForm } : w));
        } else {
          setWorkplaces([...workplaces, { id: Date.now(), ...wpForm }]);
        }
        setIsModalOpen(false);
        setEditItem(null);
      };

      const handleSaveResponsible = (e) => {
        e.preventDefault();
        if(!respForm.name.trim()) return;
        if(editItem) {
          setResponsiblePersons(responsiblePersons.map(r => r.id === editItem.id ? { ...r, ...respForm } : r));
        } else {
          setResponsiblePersons([...responsiblePersons, { id: Date.now(), ...respForm }]);
        }
        setIsModalOpen(false);
        setEditItem(null);
      };

      const handleSaveFinance = (e) => {
        e.preventDefault();
        if(!finForm.amount) return;
        if(editItem) {
          setFinances(finances.map(f => f.id === editItem.id ? { ...f, ...finForm } : f));
        } else {
          setFinances([...finances, { id: Date.now(), ...finForm }]);
        }
        setIsModalOpen(false);
        setEditItem(null);
      };

      const handleSaveDay = (e) => {
        e.preventDefault();
        if(!dayModalDate) return;
        const key = `${dayModalDate.getFullYear()}-${String(dayModalDate.getMonth()+1).padStart(2,'0')}-${String(dayModalDate.getDate()).padStart(2,'0')}`;
        if(dayForm.status === 'none') {
          const newSch = {...schedule};
          delete newSch[key];
          setSchedule(newSch);
        } else {
          setSchedule({...schedule, [key]: { ...dayForm }});
        }
        setDayModalDate(null);
      };

      return (
        <div className={`min-h-screen ${theme.bg} ${fontClass} pb-24 transition-colors duration-300 overflow-x-hidden`}>
          {/* Шапка с защитой от вылезания за край */}
          <header className={`sticky top-0 z-40 backdrop-blur-md ${theme.headerBg} px-3 py-2.5 flex items-center justify-between border-b shadow-md`}>
            <div className="flex items-center space-x-1.5 shrink-0">
              <span className="text-lg">📅</span>
              <h1 className="font-bold text-sm sm:text-base tracking-wide">Учет работы</h1>
            </div>
            {/* Горизонтальный скролл для мобильных */}
            <nav className="flex space-x-1 overflow-x-auto no-scrollbar ml-2 py-0.5">
              {[
                { id: 'schedule', label: 'График' },
                { id: 'objects', label: 'Объекты' },
                { id: 'finances', label: 'Доходы' },
                { id: 'analytics', label: 'Аналитика' },
                { id: 'settings', label: 'Настройки' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setCurrentTab(tab.id)}
                  className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${currentTab === tab.id ? theme.navActive : theme.navInactive}`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>
          </header>

          {/* Основная часть */}
          <main className="max-w-6xl mx-auto p-3 sm:p-5">
            {currentTab === 'schedule' && (
              <ScheduleView 
                schedule={schedule} 
                workplaces={workplaces}
                responsiblePersons={responsiblePersons} 
                theme={theme} 
                currentDate={currentDate} 
                setCurrentDate={setCurrentDate}
                viewMode={calendarViewMode}
                setViewMode={setCalendarViewMode}
                onSelectDay={(date) => {
                  const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
                  const existing = schedule[key];
                  setDayForm(existing ? { 
                    status: existing.status || 'work', 
                    siteName: existing.siteName || workplaces[0]?.siteName || '', 
                    isPaid: existing.isPaid !== undefined ? existing.isPaid : true, 
                    note: existing.note || '' 
                  } : { 
                    status: 'work', 
                    siteName: workplaces[0]?.siteName || '', 
                    isPaid: true, 
                    note: '' 
                  });
                  setDayModalDate(date);
                }}
              />
            )}

            {currentTab === 'objects' && (
              <ObjectsView 
                workplaces={workplaces} 
                responsiblePersons={responsiblePersons} 
                theme={theme}
                onAddWp={() => { setWpForm({ name: '', siteName: '', responsibleId: '' }); setEditItem(null); setModalType('workplace'); setIsModalOpen(true); }}
                onEditWp={(w) => { setWpForm(w); setEditItem(w); setModalType('workplace'); setIsModalOpen(true); }}
                onDeleteWp={(id) => setWorkplaces(workplaces.filter(w => w.id !== id))}
                onAddResp={() => { setRespForm({ name: '', phone: '', note: '' }); setEditItem(null); setModalType('responsible'); setIsModalOpen(true); }}
                onEditResp={(r) => { setRespForm(r); setEditItem(r); setModalType('responsible'); setIsModalOpen(true); }}
                onDeleteResp={(id) => setResponsiblePersons(responsiblePersons.filter(r => r.id !== id))}
              />
            )}

            {currentTab === 'finances' && (
              <FinancesView 
                finances={finances} 
                workplaces={workplaces} 
                responsiblePersons={responsiblePersons}
                theme={theme}
                onAddFin={() => { setFinForm({ type: 'income', date: new Date().toISOString().split('T')[0], amount: '', currency: 'EUR', siteName: '', responsibleId: '', daysNote: '', note: '' }); setEditItem(null); setModalType('finance'); setIsModalOpen(true); }}
                onEditFin={(f) => { setFinForm(f); setEditItem(f); setModalType('finance'); setIsModalOpen(true); }}
                onDeleteFin={(id) => setFinances(finances.filter(f => f.id !== id))}
              />
            )}

            {currentTab === 'analytics' && (
              <AnalyticsView schedule={schedule} finances={finances} workplaces={workplaces} responsiblePersons={responsiblePersons} theme={theme} />
            )}

            {currentTab === 'settings' && (
              <SettingsView 
                themeKey={themeKey} 
                setThemeKey={setThemeKey} 
                fontSize={fontSize} 
                setFontSize={setFontSize} 
                theme={theme}
                exportData={() => {
                  const data = { workplaces, responsiblePersons, schedule, finances, version: '1.6.0' };
                  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a'); a.href = url; a.download = `work-tracker-backup-${new Date().toISOString().split('T')[0]}.json`; a.click();
                }}
                importData={(e) => {
                  const file = e.target.files[0];
                  if(!file) return;
                  const reader = new FileReader();
                  reader.onload = (evt) => {
                    try {
                      const data = JSON.parse(evt.target.result);
                      if(data.workplaces) setWorkplaces(data.workplaces);
                      if(data.responsiblePersons) setResponsiblePersons(data.responsiblePersons);
                      if(data.schedule) setSchedule(data.schedule);
                      if(data.finances) setFinances(data.finances);
                      alert('Данные успешно импортированы!');
                    } catch(err) { alert('Ошибка при загрузке файла'); }
                  };
                  reader.readAsText(file);
                }}
              />
            )}
          </main>

          {/* Модальное окно редактирования дня */}
          {dayModalDate && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
              <div className={`${theme.modalBg} rounded-2xl p-5 w-full max-w-md shadow-2xl`}>
                <h3 className="text-base font-bold mb-3">
                  День: {dayModalDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}
                </h3>
                <form onSubmit={handleSaveDay} className="space-y-4">
                  <div>
                    <label className="block mb-1 font-medium text-xs">Статус дня</label>
                    <select className={`w-full p-2.5 rounded-xl border text-sm ${theme.input}`} value={dayForm.status} onChange={e => setDayForm({...dayForm, status: e.target.value})}>
                      <option value="work">Рабочий день</option>
                      <option value="vacation">Отпуск</option>
                      <option value="off">Отгул</option>
                      <option value="weekend">Выходной</option>
                      <option value="none">Очистить день</option>
                    </select>
                  </div>

                  {dayForm.status === 'work' && (
                    <>
                      <div>
                        <label className="block mb-1 font-medium text-xs">Объект / Работа</label>
                        <select className={`w-full p-2.5 rounded-xl border text-sm ${theme.input}`} value={dayForm.siteName} onChange={e => setDayForm({...dayForm, siteName: e.target.value})}>
                          <option value="">-- Выберите объект --</option>
                          {workplaces.map(w => <option key={w.id} value={w.siteName}>{w.siteName} ({w.name})</option>)}
                        </select>
                      </div>

                      {/* Статус оплаты */}
                      <div className="flex items-center justify-between p-3 rounded-xl border border-white/10 bg-black/20">
                        <div>
                          <div className="font-semibold text-xs">Статус оплаты дня</div>
                          <div className="text-[11px] opacity-70">
                            {dayForm.isPaid ? 'Оплачено (зеленый)' : 'Не оплачено (красный)'}
                          </div>
                        </div>
                        <label className="relative inline-flex items-center cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={dayForm.isPaid} 
                            onChange={e => setDayForm({...dayForm, isPaid: e.target.checked})} 
                            className="sr-only peer"
                          />
                          <div className="w-11 h-6 bg-red-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                        </label>
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block mb-1 font-medium text-xs">Заметка</label>
                    <input type="text" className={`w-full p-2.5 rounded-xl border text-sm ${theme.input}`} placeholder="Детали дня..." value={dayForm.note} onChange={e => setDayForm({...dayForm, note: e.target.value})} />
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setDayModalDate(null)} className="px-4 py-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white text-xs font-semibold">Отмена</button>
                    <button type="submit" className={`px-5 py-2 rounded-xl text-xs font-semibold ${theme.primary}`}>Сохранить</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Модальные окна для Объектов, Ответственных и Доходов */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
              <div className={`${theme.modalBg} rounded-2xl p-5 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto`}>
                
                {modalType === 'workplace' && (
                  <>
                    <h3 className="text-base font-bold mb-4">{editItem ? 'Редактировать объект' : 'Новый объект'}</h3>
                    <form onSubmit={handleSaveWorkplace} className="space-y-4">
                      <div>
                        <label className="block mb-1 font-medium text-xs">Место работы (Компания / Подрядчик)</label>
                        <input required type="text" className={`w-full p-2.5 rounded-xl border text-sm ${theme.input}`} placeholder="ООО СтройСервис" value={wpForm.name} onChange={e => setWpForm({...wpForm, name: e.target.value})} />
                      </div>
                      <div>
                        <label className="block mb-1 font-medium text-xs">Наименование объекта / работы</label>
                        <input required type="text" className={`w-full p-2.5 rounded-xl border text-sm ${theme.input}`} placeholder="ЖК Солнечный" value={wpForm.siteName} onChange={e => setWpForm({...wpForm, siteName: e.target.value})} />
                      </div>
                      <div>
                        <label className="block mb-1 font-medium text-xs">Ответственное лицо (Плательщик)</label>
                        <select className={`w-full p-2.5 rounded-xl border text-sm ${theme.input}`} value={wpForm.responsibleId} onChange={e => setWpForm({...wpForm, responsibleId: e.target.value})}>
                          <option value="">-- Без ответственного --</option>
                          {responsiblePersons.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                        </select>
                      </div>
                      <div className="flex justify-end space-x-2 pt-2">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white text-xs font-semibold">Отмена</button>
                        <button type="submit" className={`px-5 py-2 rounded-xl text-xs font-semibold ${theme.primary}`}>Сохранить</button>
                      </div>
                    </form>
                  </>

    // Компонент: График с 2 режимами (Сетка и Развернутый список)
    function ScheduleView({ schedule, workplaces, responsiblePersons, theme, currentDate, setCurrentDate, viewMode, setViewMode, onSelectDay }) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;

      const calendarCells = [];
      for(let i = 0; i < firstDayIndex; i++) calendarCells.push(null);
      for(let d = 1; d <= daysInMonth; d++) calendarCells.push(new Date(year, month, d));

      const monthDaysList = [];
      for(let d = 1; d <= daysInMonth; d++) monthDaysList.push(new Date(year, month, d));

      return (
        <div className={`p-3 sm:p-5 rounded-2xl border ${theme.card} shadow-xl`}>
          {/* Панель управления календарем */}
          <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
            <h2 className="text-base sm:text-xl font-bold">{monthNames[month]} {year}</h2>
            
            <div className="flex items-center space-x-2">
              {/* Переключатель вида */}
              <div className="flex rounded-xl p-0.5 bg-black/20 border border-white/10">
                <button
                  onClick={() => setViewMode('grid')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${viewMode === 'grid' ? theme.primary : 'opacity-70'}`}
                >
                  Сетка
                </button>
                <button
                  onClick={() => setViewMode('list')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${viewMode === 'list' ? theme.primary : 'opacity-70'}`}
                >
                  Развернутый
                </button>
              </div>

              {/* Переход по месяцам */}
              <div className="flex space-x-1">
                <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-xs">‹</button>
                <button onClick={() => setCurrentDate(new Date())} className="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold">Сегодня</button>
                <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-xs">›</button>
              </div>
            </div>
          </div>

          {/* Вид 1: Компактная Сетка */}
          {viewMode === 'grid' && (
            <>
              <div className="grid grid-cols-7 gap-1.5 mb-1.5 text-center font-semibold text-[11px] opacity-70">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
              </div>

              <div className="grid grid-cols-7 gap-1.5">
                {calendarCells.map((date, idx) => {
                  if(!date) return <div key={idx} className="h-20 sm:h-24"></div>;
                  const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
                  const dayData = schedule[key];

                  let badgeStyle = "border border-white/10 bg-black/5";
                  let label = "";
                  const isUnpaid = dayData && dayData.status === 'work' && dayData.isPaid === false;

                  if(dayData) {
                    if(dayData.status === 'work') { 
                      badgeStyle = isUnpaid ? theme.badgeUnpaid : theme.badgeWork; 
                      label = dayData.siteName || 'Работа'; 
                    }
                    if(dayData.status === 'vacation') { badgeStyle = theme.badgeVacation; label = 'Отпуск'; }
                    if(dayData.status === 'off') { badgeStyle = theme.badgeOff; label = 'Отгул'; }
                    if(dayData.status === 'weekend') { badgeStyle = theme.badgeOff; label = 'Выходной'; }
                  }

                  return (
                    <div 
                      key={idx} 
                      onClick={() => onSelectDay(date)}
                      className={`h-20 sm:h-24 p-1.5 rounded-xl border flex flex-col justify-between cursor-pointer transition-all hover:scale-[1.02] ${badgeStyle}`}
                    >
                      <div className="flex justify-between items-center text-xs font-bold">
                        <span>{date.getDate()}</span>
                        {isUnpaid && <span className="text-[10px] bg-red-600 text-white px-1 rounded font-black">НЕ ОПЛ</span>}
                      </div>
                      <div className="overflow-hidden">
                        {dayData && (
                          <div className="text-[10px] leading-tight font-medium truncate mt-0.5">
                            {label}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}

          {/* Вид 2: Развернутый список вниз */}
          {viewMode === 'list' && (
            <div className="space-y-2 max-h-[65vh] overflow-y-auto pr-1">
              {monthDaysList.map((date, idx) => {
                const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
                const dayData = schedule[key];
                const dayOfWeek = date.toLocaleDateString('ru-RU', { weekday: 'short' });
                const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                const isUnpaid = dayData && dayData.status === 'work' && dayData.isPaid === false;

                const wp = workplaces.find(w => w.siteName === dayData?.siteName);
                const resp = wp ? responsiblePersons.find(r => r.id == wp.responsibleId) : null;

                return (
                  <div 
                    key={idx}
                    onClick={() => onSelectDay(date)}
                    className={`p-3 rounded-xl border flex items-center justify-between cursor-pointer transition-all ${
                      isUnpaid 
                        ? 'bg-red-950/40 border-red-500/80 text-red-100 shadow-md shadow-red-950/30' 
                        : dayData ? 'bg-black/20 border-white/10' : isWeekend ? 'opacity-40 border-dashed border-white/10' : 'bg-black/5 border-white/5'
                    }`}
                  >
                    <div className="flex items-center space-x-3">
                      <div className={`text-center w-10 py-1 rounded-lg ${isWeekend ? 'bg-amber-500/20 text-amber-300' : 'bg-white/10'}`}>
                        <div className="text-xs font-bold">{date.getDate()}</div>
                        <div className="text-[10px] uppercase font-semibold">{dayOfWeek}</div>
                      </div>

                      <div>
                        {dayData ? (
                          <>
                            <div className="flex items-center space-x-2">
                              <span className="font-bold text-sm">
                                {dayData.status === 'work' ? (dayData.siteName || 'Рабочий день') :
                                 dayData.status === 'vacation' ? '🌴 Отпуск' :
                                 dayData.status === 'off' ? '☕ Отгул' : '🏠 Выходной'}
                              </span>
                              {isUnpaid && (
                                <span className="bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-extrabold tracking-wide">НЕ ОПЛАЧЕНО</span>
                              )}
                            </div>
                            {resp && <div className="text-xs opacity-75">Ответственный: {resp.name}</div>}
                            {dayData.note && <div className="text-xs opacity-60">Заметка: {dayData.note}</div>}
                          </>
                        ) : (
                          <div className="text-xs opacity-40">Нет записи</div>
                        )}
                      </div>
                    </div>

                    <button className="text-xs px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20">
                      {dayData ? 'Изменить' : '+ Отметить'}
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // Компонент: Детализированная Аналитика с выбором конкретного месяца и года
    function AnalyticsView({ schedule, finances, workplaces, responsiblePersons, theme }) {
      const [filterPeriod, setFilterPeriod] = useState('month'); // 'month', 'year', 'all'
      
      const now = new Date();
      const [selectedMonth, setSelectedMonth] = useState(now.getMonth());
      const [selectedYear, setSelectedYear] = useState(now.getFullYear());
      
      const [filterSite, setFilterSite] = useState('');
      const [filterResp, setFilterResp] = useState('');

      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

      // Фильтрованные финансовые записи
      const filteredFinances = useMemo(() => {
        return finances.filter(f => {
          if(filterSite && f.siteName !== filterSite) return false;
          if(filterResp && f.responsibleId != filterResp) return false;
          
          if(!f.date) return true;
          const [fYear, fMonth] = f.date.split('-').map(Number);

          if(filterPeriod === 'month') {
            if(fYear !== selectedYear || (fMonth - 1) !== selectedMonth) return false;
          } else if(filterPeriod === 'year') {
            if(fYear !== selectedYear) return false;
          }
          return true;
        });
      }, [finances, filterPeriod, selectedMonth, selectedYear, filterSite, filterResp]);

      // Суммы по валютам
      const totalsByCurrency = useMemo(() => {
        const totals = { income: {}, advance: {} };
        filteredFinances.forEach(f => {
          const cat = f.type === 'income' ? 'income' : 'advance';
          totals[cat][f.currency] = (totals[cat][f.currency] || 0) + parseFloat(f.amount || 0);
        });
        return totals;
      }, [filteredFinances]);

      // Подсчет рабочих и неоплаченных дней по объектам
      const siteWorkStats = useMemo(() => {
        const stats = {};
        Object.entries(schedule).forEach(([dateStr, day]) => {
          if(day.status === 'work' && day.siteName) {
            if(filterSite && day.siteName !== filterSite) return;

            const [dYear, dMonth] = dateStr.split('-').map(Number);
            if(filterPeriod === 'month') {
              if(dYear !== selectedYear || (dMonth - 1) !== selectedMonth) return;
            } else if(filterPeriod === 'year') {
              if(dYear !== selectedYear) return;
            }

            if(!stats[day.siteName]) {
              stats[day.siteName] = { totalDays: 0, unpaidDays: 0, paidDays: 0 };
            }
            stats[day.siteName].totalDays += 1;
            if(day.isPaid === false) {
              stats[day.siteName].unpaidDays += 1;
            } else {
              stats[day.siteName].paidDays += 1;
            }
          }
        });
        return stats;
      }, [schedule, filterPeriod, selectedMonth, selectedYear, filterSite]);

      return (
        <div className="space-y-5">
          {/* Панель фильтров */}
          <div className={`p-4 rounded-2xl border ${theme.card} space-y-3`}>
            <div className="flex flex-wrap gap-2 items-center justify-between">
              <div className="flex space-x-1">
                {[
                  { id: 'month', label: 'За выбранный месяц' },
                  { id: 'year', label: 'За выбранный год' },
                  { id: 'all', label: 'За все время' }
                ].map(p => (
                  <button
                    key={p.id}
                    onClick={() => setFilterPeriod(p.id)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${filterPeriod === p.id ? theme.primary : 'bg-white/10 hover:bg-white/20'}`}
                  >
                    {p.label}
                  </button>
                ))}
              </div>

              {/* Выбор конкретного месяца и года */}
              {filterPeriod !== 'all' && (
                <div className="flex space-x-2">
                  {filterPeriod === 'month' && (
                    <select className={`p-1.5 rounded-xl border text-xs font-semibold ${theme.input}`} value={selectedMonth} onChange={e => setSelectedMonth(Number(e.target.value))}>
                      {monthNames.map((m, idx) => <option key={idx} value={idx}>{m}</option>)}
                    </select>
                  )}
                  <select className={`p-1.5 rounded-xl border text-xs font-semibold ${theme.input}`} value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))}>
                    {[2024, 2025, 2026, 2027, 2028].map(y => <option key={y} value={y}>{y} г.</option>)}
                  </select>
                </div>
              )}
            </div>

            <div className="flex flex-wrap gap-2 pt-2 border-t border-white/10">
              <select className={`p-2 rounded-xl border text-xs flex-1 ${theme.input}`} value={filterSite} onChange={e => setFilterSite(e.target.value)}>
                <option value="">Все объекты</option>
                {workplaces.map(w => <option key={w.id} value={w.siteName}>{w.siteName}</option>)}
              </select>
              <select className={`p-2 rounded-xl border text-xs flex-1 ${theme.input}`} value={filterResp} onChange={e => setFilterResp(e.target.value)}>
                <option value="">Все ответственные</option>
                {responsiblePersons.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
            </div>
          </div>

          {/* Карточки сумм */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className={`p-4 sm:p-5 rounded-2xl border ${theme.card}`}>
              <h3 className="text-sm font-bold mb-2">💰 Получено доходов</h3>
              {Object.keys(totalsByCurrency.income).length === 0 ? (
                <p className="text-xs opacity-60">Нет данных за выбранный период</p>
              ) : (
                <div className="space-y-1">
                  {Object.entries(totalsByCurrency.income).map(([curr, sum]) => (
                    <div key={curr} className="text-lg font-bold text-emerald-400">{sum.toFixed(2)} {curr}</div>
                  ))}
                </div>
              )}
            </div>

            <div className={`p-5 rounded-2xl border ${theme.card}`}>
              <h3 className="text-sm font-bold mb-2">📥 Получено авансов</h3>
              {Object.keys(totalsByCurrency.advance).length === 0 ? (
                <p className="text-xs opacity-60">Нет данных за выбранный период</p>
              ) : (
                <div className="space-y-1">
                  {Object.entries(totalsByCurrency.advance).map(([curr, sum]) => (
                    <div key={curr} className="text-lg font-bold text-amber-400">{sum.toFixed(2)} {curr}</div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Аналитика отработанных и неоплаченных дней по объектам */}
          <div className={`p-4 sm:p-5 rounded-2xl border ${theme.card}`}>
            <h3 className="text-sm sm:text-base font-bold mb-3">🏗️ Статус оплаты и дней по объектам</h3>
            {Object.keys(siteWorkStats).length === 0 ? (
              <p className="text-xs opacity-60">Нет рабочих дней за выбранный период</p>
            ) : (
              <div className="space-y-2.5">
                {Object.entries(siteWorkStats).map(([site, stat]) => {
                  const wp = workplaces.find(w => w.siteName === site);
                  const resp = wp ? responsiblePersons.find(r => r.id == wp.responsibleId) : null;

                  return (
                    <div key={site} className="p-3 rounded-xl bg-black/15 border border-white/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                      <div>
                        <div className="font-bold text-sm">{site}</div>
                        {resp && <div className="text-xs opacity-75">Ответственный: {resp.name}</div>}
                      </div>

                      <div className="flex items-center space-x-2">
                        <span className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-white/10">
                          Всего: {stat.totalDays} дн.
                        </span>
                        {stat.unpaidDays > 0 ? (
                          <span className="px-2.5 py-1 rounded-lg text-xs font-bold bg-red-600/90 text-white animate-pulse">
                            Не оплачено: {stat.unpaidDays} дн.
                          </span>
                        ) : (
                          <span className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                            Все дни оплачены
                          </span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Компонент: Настройки
    function SettingsView({ themeKey, setThemeKey, fontSize, setFontSize, theme, exportData, importData }) {
      return (
        <div className={`p-5 sm:p-6 rounded-2xl border ${theme.card} space-y-5 max-w-xl mx-auto`}>
          <h2 className="text-lg font-bold">Настройки приложения</h2>

          <div>
            <label className="block mb-1.5 font-medium text-xs">Тема оформления</label>
            <select className={`w-full p-2.5 rounded-xl border text-sm ${theme.input}`} value={themeKey} onChange={e => setThemeKey(e.target.value)}>
              <option value="ocean">Морская</option>
              <option value="sand">Песочная</option>
              <option value="forest">Лесная</option>
              <option value="lavender">Лаванда</option>
              <option value="glassmorphism">Прозрачная</option>
              <option value="emeraldVelvet">Темный зеленый бархат</option>
              <option value="blueSatin">Синий атлас</option>
            </select>
          </div>

          <div>
            <label className="block mb-1.5 font-medium text-xs">Размер шрифта</label>
            <select className={`w-full p-2.5 rounded-xl border text-sm ${theme.input}`} value={fontSize} onChange={e => setFontSize(e.target.value)}>
              <option value="small">Мелкий</option>
              <option value="normal">Нормальный</option>
              <option value="large">Крупный</option>
              <option value="xlarge">Очень крупный</option>
            </select>
          </div>

          <div className="pt-4 border-t border-white/10 space-y-3">
            <h3 className="font-bold text-xs">Резервное копирование и восстановление</h3>
            <div className="flex gap-2">
              <button onClick={exportData} className={`flex-1 py-2.5 rounded-xl text-xs font-semibold ${theme.primary}`}>Экспорт (JSON)</button>
              <label className="flex-1 py-2.5 rounded-xl text-xs font-semibold text-center cursor-pointer bg-white/10 hover:bg-white/20 text-white">
                Загрузить сохраненные данные
                <input type="file" accept=".json" onChange={importData} className="hidden" />
              </label>
            </div>
          </div>

          <div className="pt-3 border-t border-white/10 text-xs opacity-60 space-y-1">
            <div>Версия приложения: v1.6.0</div>
            <div>Дата последнего обновления: 26 октября 2026</div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
